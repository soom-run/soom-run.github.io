<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOOM</title>
<style>
:root { --bg: #f6f2e9; --card: #fff; --ink: #1d1b18; --muted: #6f695f; --line: #e4ddcf; --accent: #c2541c; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg: #0d0d0e; --card: #1b1b1d; --ink: #f2f0ec; --muted: #a29d94; --line: #333336; --accent: #f0a23a; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; word-break: keep-all; }
main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 28px; line-height: 1.3; margin: 0 0 4px; }
h2 { font-size: 19px; margin: 36px 0 8px; }
p, ul { margin: 8px 0; }
ul { padding-left: 20px; }
a { color: var(--accent); }
.date { color: var(--muted); font-size: 14px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 16px 0; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 14px; }
th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
th { background: var(--card); }
.promise { background: var(--card); background: color-mix(in srgb, var(--accent) 10%, var(--card)); border: 2px solid var(--accent); border-radius: 14px; padding: 18px 18px 14px; margin: 20px 0; }
.promise h2 { font-size: 21px; line-height: 1.4; margin: 0 0 12px; }
.promise p { margin: 10px 0; }
.promise strong { display: block; }
.promise .note { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
<h1>SOOM</h1>
<p class="date">건강 앱의 러닝 기록을 분석하는 iPhone 앱</p>
<ul>
<li><a href="support.html">지원</a></li>
<li><a href="privacy.html">개인정보처리방침</a></li>
</ul>
</main>
</body>
</html>
